
name: Saient Wan2.1 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Wan2.1 libraries
        run: |
          test -s engine/arm64-v8a/libquartz.so
          test -s engine/arm64-v8a/libquartz-wan.so
          file engine/arm64-v8a/libquartz-wan.so

      - name: Install dependencies
        run: npm ci

      - name: Check Wan2.1
        run: npm run test:wan

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saient-wan21-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
