
name: Saient Wan2.1 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saient-android-debug.yml'
      - 'app/**'
      - 'lib/**'
      - 'modules/**'
      - 'plugins/**'
      - 'engine/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Verify Wan2.1 libraries
        run: |
          test -s engine/arm64-v8a/libquartz.so
          test -s engine/arm64-v8a/libquartz-wan.so
          file engine/arm64-v8a/libquartz.so
          file engine/arm64-v8a/libquartz-wan.so
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          lock = json.loads(pathlib.Path("engine/wan/BACKEND_LOCK.json").read_text())
          p = pathlib.Path("engine/arm64-v8a/libquartz-wan.so")
          header = p.read_bytes()[:20]
          assert header[:4] == b"\x7fELF" and header[4] == 2, "Not a 64-bit ELF"
          assert struct.unpack_from("<H", header, 18)[0] == 183, "Not AArch64"
          assert p.stat().st_size == lock["artifact"]["bytes"], "Wan size mismatch"
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == lock["artifact"]["sha256"], "Wan SHA-256 mismatch"
          print("Wan2.1 ARM64 ELF and SHA-256 verified")
          PY

      - name: Synchronize npm lockfile for CI
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Wan2.1, models and TypeScript
        run: |
          npm run test:wan
          npm run test:models
          npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle memory for native libraries
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\n' >> android/gradle.properties
          grep '^org.gradle.jvmargs=' android/gradle.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Check APK contains Wan2.1
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libquartz-wan.so'
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saient-wan21-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
